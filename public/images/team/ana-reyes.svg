<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Avatar for Ana Reyes">
  <defs>
    <clipPath id="circleAR"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="gradAR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1222"/>
      <stop offset="100%" stop-color="#1E2A45"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#circleAR)">
    <rect width="200" height="200" fill="url(#gradAR)"/>
    <polygon points="200,0 200,120 90,0" fill="#F59E0B" opacity="0.25"/>
    <circle cx="55" cy="150" r="70" fill="#14B8A6" opacity="0.3"/>
  </g>
  <text x="100" y="115" font-family="Space Grotesk, sans-serif" font-size="56" font-weight="600" fill="#F6F7FB" text-anchor="middle">AR</text>
</svg>
